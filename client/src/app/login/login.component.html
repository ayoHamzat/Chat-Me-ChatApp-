<form #userForm="ngForm" (ngSubmit)="login()"
    class="flex items-center justify-center h-full bg-zinc-950 relative overflow-hidden px-4">

    <!-- Ambient glow blobs -->
    <div class="absolute top-[-120px] right-[-80px] w-96 h-96 bg-amber-500/8 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-80px] left-[-60px] w-72 h-72 bg-amber-400/6 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Auth Card -->
    <div class="card-in w-full max-w-sm bg-zinc-900/90 border border-zinc-800 border-t-2 border-t-amber-400 rounded-2xl shadow-2xl shadow-black/50 px-8 py-10 z-10">

        <!-- Icon + heading -->
        <div class="flex flex-col items-center mb-7">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-4 shadow-lg shadow-amber-500/10">
                <i class="material-icons text-3xl text-amber-400">chat_bubble</i>
            </div>
            <h1 class="text-2xl font-bold text-white">Welcome back</h1>
            <p class="text-sm text-zinc-500 mt-1">Sign in to continue</p>
        </div>

        <div class="flex flex-col gap-1">
            <mat-form-field class="w-full" appearance="fill">
                <mat-label>Email</mat-label>
                <input matInput required name="email" [(ngModel)]="email" #emailModel="ngModel" placeholder="Email" />
                @if(emailModel.errors?.['required']){
                <mat-error>Email is required.</mat-error>
                }
            </mat-form-field>

            <mat-form-field class="w-full" appearance="fill">
                <mat-label>Password</mat-label>
                <input matInput [type]="hide() ? 'text' : 'password'" required name="password"
                    [(ngModel)]="password" #passwordModel="ngModel" placeholder="Password" />
                <mat-icon (click)="togglePassword($event)" matSuffix class="cursor-pointer">
                    {{ hide() ? 'visibility_off' : 'visibility' }}
                </mat-icon>
                @if(passwordModel.errors?.['required']){
                <mat-error>Password is required.</mat-error>
                }
            </mat-form-field>

            <app-button (action)="login()" [text]="'Sign In'" [isDisabled]="!userForm.valid"
                [isLoading]="authService.isLoading()" />

            <p class="text-xs text-center text-zinc-500 mt-4">
                Don't have an account?
                <a class="text-amber-400 hover:text-amber-300 font-semibold transition-colors" [routerLink]="'/register'">
                    Create one
                </a>
            </p>
        </div>
    </div>
</form>
